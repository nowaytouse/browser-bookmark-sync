name: CI

on:
  push:
    branches: [master, main, codex/bookmark-health-hardening]
  pull_request:
    branches: [master, main, codex/bookmark-health-hardening]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    name: Test (${{ matrix.os }}, nightly)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # Keep check names stable while pinning images; macOS remains ARM64.
        include:
          - os: macos-latest
            runner: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install --no-self-update && rustc --version --verbose

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --features native-gui -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --features native-gui --verbose -- --test-threads=2

  build:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # Preserve artifact names and native ARM64 coverage without latest-image drift.
        include:
          - os: macos-latest
            runner: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install --no-self-update && rustc --version --verbose

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --locked --release --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-bookmark-sync-${{ matrix.os }}
          path: |
            target/release/browser-bookmark-sync
            target/release/browser-bookmark-sync.exe

[package]
name = "browser-bookmark-sync"
version = "0.1.0"
edition = "2021"
authors = ["Browser Sync Team"]
description = "A reliable cross-browser bookmark synchronization tool"
default-run = "browser-bookmark-sync"

[dependencies]
# CLI framework (latest)
clap = { version = "4.5.60", features = ["derive", "cargo"] }

# Serialization (latest)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error handling (latest)
anyhow = "1.0.104"
thiserror = "2.0.19"

# Logging (latest)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# File system operations (latest)
walkdir = "2.5.0"
sha2 = "0.10.9"

# Time handling (latest)
chrono = { version = "0.4.45", features = ["serde"] }

# Console output (latest)
console = "0.16.4"

# UUID generation (latest)
uuid = { version = "1.24.0", features = ["v4"] }

# Async runtime & HTTP (latest)
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.10.2"
futures = "0.3.33"
reqwest = { version = "0.12.28", features = ["json"] }

# Local GUI server (latest)
axum = { version = "0.7.9", features = ["macros"] }
tower = "0.5.3"
open = "5.4.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }

# SQLite for Firefox-based browsers (latest)
rusqlite = { version = "0.33.0", features = ["bundled"] }

# HTML parsing for Safari export (latest)
scraper = "0.22.0"
html5ever = "0.27.0"

# Progress bars & UX (latest)
indicatif = "0.18.6"

# Parallel processing for performance (latest)
rayon = "1.12.0"

# Regex for enhanced rule matching (latest)
regex = "1.13.1"

# Crypto for password/cookie decryption (latest)
aes = "0.8.4"
cbc = "0.1.2"
pbkdf2 = "0.12.2"
sha1 = "0.10.7"

# macOS specific (latest)
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10.0"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.9.0"

[[test]]
name = "integration_test"
path = "src/tests/integration_test.rs"

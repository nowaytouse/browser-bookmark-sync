[package]
name = "browser-bookmark-sync"
version = "0.1.0"
edition = "2021"
authors = ["Browser Sync Team"]
description = "Collect, deduplicate, and health-check browser bookmarks safely"
default-run = "browser-bookmark-sync"

[features]
native-gui = ["dep:eframe", "dep:rfd"]

[dependencies]
# CLI framework (latest)
clap = { version = "4.5.60", features = ["derive", "cargo"] }

# Serialization (latest)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
prost = "0.14.1"
rusty-leveldb = "4.0.1"
lz4_flex = "0.11.5"

# Error handling (latest)
anyhow = "1.0.104"
thiserror = "2.0.19"

# Logging (latest)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# File system operations & hashing (latest)
walkdir = "2.5.0"
blake3 = "1.5"

# Time handling (latest)
chrono = { version = "0.4.45", features = ["serde"] }

# Console output (latest)
console = "0.16.4"

# UUID generation (latest)
uuid = { version = "1.24.0", features = ["v4"] }

# Async runtime & HTTP (latest)
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.10.2"
futures = "0.3.33"
reqwest = { version = "0.12.28", features = ["json"] }
async-trait = "0.1"

# Local GUI server (latest)
axum = { version = "0.7.9", features = ["macros"] }
tower = "0.5.3"
open = "5.4.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tempfile = "3.27.0"

# Native review window; no browser engine or local web server.
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
rfd = { version = "=0.15.4", optional = true }

# SQLite for Firefox-based browsers (latest)
rusqlite = { version = "0.33.0", features = ["backup", "bundled"] }

# HTML parsing for Safari export (latest)
scraper = "0.22.0"
html5ever = "0.27.0"
plist = "1.10.0"

# Progress bars & UX (latest)
indicatif = "0.18.6"

# Parallel processing for performance (latest)
rayon = "1.12.0"

# Regex for enhanced rule matching (latest)
regex = "1.13.1"

# Crypto for password/cookie decryption (latest)
aes = "0.8.4"
cbc = "0.1.2"
pbkdf2 = "0.12.2"
sha1 = "0.10.7"
hickory-resolver = { version = "0.26.1", features = ["https-ring", "tokio", "webpki-roots"] }
psl = "2.1.226"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.9.0"

[[test]]
name = "integration_test"
path = "src/tests/integration_test.rs"

[[bin]]
name = "bookmark-review"
path = "src/bin/bookmark-review.rs"
required-features = ["native-gui"]

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unused_qualifications = "warn"

[lints.clippy]
# The legacy browser adapters predate this lint policy; keep the production
# gate focused on correctness/safety lints below until those modules are retired.
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
as_conversions = "allow"
implicit_clone = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "allow"
map_unwrap_or = "allow"
needless_borrow = "allow"
should_implement_trait = "allow"
field_reassign_with_default = "allow"
type_complexity = "allow"
arc_with_non_send_sync = "allow"
unnecessary_sort_by = "allow"
question_mark = "allow"
manual_checked_ops = "allow"
items_after_test_module = "allow"
single_element_loop = "allow"
cloned_ref_to_slice_refs = "allow"
module_inception = "allow"
module_name_repetitions = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
str_to_string = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }
